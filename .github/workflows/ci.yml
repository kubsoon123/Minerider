name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check
      - run: git diff --check

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --locked

  shared-world-benchmark:
    name: Shared world release benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --release --locked --bin shared_world_benchmark

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  codegen-drift:
    name: Protocol codegen drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run -p minerider-codegen -- --check

  lua-production:
    name: Lua production wrapper (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # `lua` is off by default (see Cargo.toml) — a normal build/test/PR
      # touching unrelated code never pays the mlua/vendored-Lua compile
      # cost. This job proves the production wrapper (src/lua/, the
      # minerider-lua binary) builds, its own unit tests pass, and it's
      # clippy-clean on both platforms, independent of the separate
      # lua-benchmark harness below (which additionally exercises the
      # production runtime end to end against real network fixtures — see
      # that job's `production_smoke` tests).
      - run: cargo build --features lua --locked
      - run: cargo test --features lua --locked
      - run: cargo clippy --features lua --all-targets -- -D warnings

  lua-benchmark-smoke:
    name: Lua runtime benchmark smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `lua-benchmark` is off by default (see Cargo.toml): this is the only
      # job that builds mlua/vendored Lua, so a normal PR touching unrelated
      # code never pays that compile cost. Proves the vendored build itself
      # works on both platforms — the mission's own requirement — not just
      # that the sandbox logic is correct.
      - run: cargo build --features lua-benchmark --locked
      # The full correctness suite: deterministic worker assignment, event
      # ordering/isolation, bounded-queue overflow/coalescing, instruction
      # and memory limits actually aborting, consecutive-error disabling,
      # command routing, reconnect-storm + proxy-persistence-across-
      # reconnect, chunk-sharing-across-proxy-groups and opt-out proofs —
      # see `docs/lua_runtime_benchmark.md` for what each test covers.
      # Serialized (not the default parallel test runner): several of these
      # spawn a real mock TCP server plus real ClientSupervisors with their
      # own settle-timeout margins, and shared CI runners have far fewer
      # cores than a dev machine — running them concurrently caused a real,
      # reproducible flake here (contention pushed connect past its
      # timeout), not a code bug.
      #
      # Deliberately excludes `production_smoke` (run as its own step
      # below): once that module's real-network integration tests were
      # added, running everything in one `cargo test` process caused
      # *different* pre-existing tests to fail from run to run on the
      # ubuntu runner (not the same test each time) even after widening
      # their settle margins — a sign of genuine resource contention
      # accumulating within one long-lived test process on a shared
      # 2-core runner, not something one more timeout bump fixes. Splitting
      # into two process-isolated steps gives each suite a clean resource
      # baseline instead of inheriting whatever the other left behind.
      #
      # That diagnosis was never fully separated from an alternative
      # explanation available at the time: several concrete bugs since
      # fixed on this branch could themselves have produced exactly this
      # symptom — an unbounded worker-startup wait, a lost cross-worker
      # callback, and (most directly) `shutdown` not actually tracking or
      # waiting for every action task/worker thread it spawned, letting
      # state leak from one test into the next within the same process.
      # Process isolation alone doesn't distinguish "the runner is just
      # slow" from "something leaked" — it just hides either one behind a
      # clean process boundary. `production_smoke`'s
      # `repeated_start_connect_shutdown_cycles_do_not_accumulate_state`
      # now asserts a direct cleanup invariant for this (OS thread count on
      # Linux, handle count on Windows — see
      # `crate::lua_benchmark::metrics::process_thread_count`) in addition
      # to the existing timing-based inference, specifically so a future
      # regression here is caught by more than "a CI runner felt slow
      # today". The split itself stays for now — local, many-core
      # non-flakiness doesn't prove safety on a constrained shared runner,
      # and removing a working mitigation without CI-scale evidence is
      # exactly the kind of change to avoid making on inference alone.
      - run: cargo test --features lua-benchmark --lib lua_benchmark --locked -- --test-threads=1 --skip production_smoke
      # `lua_benchmark::full_runtime::production_smoke`: the
      # production-wrapper smoke (4 default workers, several bots, 2 local
      # fake proxy groups incl. the actual shipped examples/lua/swarm.lua,
      # reconnect-preserves-proxy, every targeted state view, bot- and
      # swarm-scoped timers, GUI click, one-bad-handler isolation, graceful
      # shutdown) driven through the real production runtime
      # (`crate::lua::runtime::run_swarm`) — reusing the same mock
      # server/fake-SOCKS5 fixture as the step above rather than a second
      # test harness, just isolated into its own process (see comment
      # above).
      - run: cargo test --features lua-benchmark --lib lua_benchmark::full_runtime::production_smoke --locked -- --test-threads=1
      # A tiny, deterministic real-CLI smoke run per architecture family —
      # proves the actual binary (not just its unit tests) compiles, runs,
      # and exits cleanly against a local mock server only. Never the full
      # 100/400/800-bot benchmark; see "Manual full benchmark" below.
      - name: CLI smoke — synthetic, shared VM
        run: cargo run --features lua-benchmark --locked --bin lua_runtime_benchmark -- --mode shared-lua --scenario synthetic --bots 10 --event-rate busy --duration-secs 2 --script realistic --seed 42
      - name: CLI smoke — synthetic, 4-worker pool
        run: cargo run --features lua-benchmark --locked --bin lua_runtime_benchmark -- --mode worker-pool --lua-workers 4 --scenario synthetic --bots 10 --event-rate typical --duration-secs 2 --script table-work --seed 42
      - name: CLI smoke — full-runtime idle + chunk sharing
        run: cargo run --features lua-benchmark --locked --bin lua_runtime_benchmark -- --mode shared-lua --scenario full-runtime --full-scenario chunks --chunk-count 9 --bots 5 --duration-secs 2 --script light-state --seed 42
      - name: CLI smoke — full-runtime proxy groups (fake SOCKS5 only)
        run: cargo run --features lua-benchmark --locked --bin lua_runtime_benchmark -- --mode rust-baseline --scenario full-runtime --full-scenario proxy-groups --proxy-group-size 2 --bots 6 --duration-secs 2 --script no-op --seed 42
