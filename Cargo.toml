[workspace]
members = [".", "crates/minerider-protocol"]

[workspace.dependencies]
bytes = "1"
thiserror = "2"
flate2 = "1"
rsa = "0.9"
aes = "0.8"
cfb8 = "0.8"
rand = "0.8"
criterion = "0.5"

[package]
name = "minerider"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "High performance Minecraft Java Edition client engine: Rust core, Lua scripting, generated protocol"
license = "MIT OR Apache-2.0"
keywords = ["minecraft", "client", "bot", "protocol"]
categories = ["game-development", "network-programming"]

[dependencies]
minerider-protocol = { path = "crates/minerider-protocol" }
tokio = { version = "1", features = ["full"] }
bytes = { workspace = true }
thiserror = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = { workspace = true }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
rsa = { workspace = true }

[profile.release]
lto = "thin"
codegen-units = 1
