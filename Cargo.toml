[workspace]
members = [".", "crates/minerider-protocol", "crates/minerider-codegen"]

[workspace.dependencies]
bytes = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
rsa = "0.9"
aes = "0.8"
cfb8 = "0.8"
rand = "0.8"
sha1 = "0.10"
criterion = "0.5"

[package]
name = "minerider"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "High performance Minecraft Java Edition client engine: Rust core, generated protocol; Lua scripting planned"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["minecraft", "client", "bot", "protocol"]
categories = ["game-development", "network-programming"]

[dependencies]
minerider-protocol = { path = "crates/minerider-protocol", version = "0.1.0" }
tokio = { version = "1", features = ["full"] }
# Tokio project's own cancellation primitive (`CancellationToken`), used by
# `core::supervisor`: a hand-rolled watch-channel flag hit real borrow-check
# conflicts with `tokio::select!` arms that also need `&self`, plus a
# busy-loop risk once the sending handle is dropped. `sync`-only, no
# runtime/codec/net features pulled in.
tokio-util = { version = "0.7", default-features = false }
bytes = { workspace = true }
thiserror = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha1 = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies"] }

# Production Lua scripting (`src/lua/`) plus the benchmark harness that
# validated its architecture (`src/lua_benchmark/`, see
# docs/lua_runtime_benchmark.md). `lua54` + `vendored` needs no system Lua
# install and builds identically on Ubuntu/Windows. `send` is deliberately
# NOT enabled: every `Lua` VM here — the 4 production workers and every
# benchmark architecture candidate, including the per-bot-VM control
# comparison — runs on its own dedicated `std::thread` for that VM's whole
# lifetime. It never crosses an `.await` or moves between threads, so
# `Lua: Send` is never required.
mlua = { version = "0.12", optional = true, default-features = false, features = [
    "lua54",
    "vendored",
] }

[features]
# Production embedded Lua scripting: `src/lua/`, the `minerider-lua` binary,
# `minerider.create_swarm(...)`. Off by default — a normal `cargo build`
# never compiles mlua or the vendored Lua C sources.
lua = ["dep:mlua"]
# Adds `src/lua_benchmark/`: the architecture-validation harness and its CLI
# (`lua_runtime_benchmark`). Depends on `lua` for the sandbox/queue
# primitives it reuses rather than duplicating.
lua-benchmark = ["lua"]

[[bin]]
name = "lua_runtime_benchmark"
path = "src/bin/lua_runtime_benchmark.rs"
required-features = ["lua-benchmark"]

[[bin]]
name = "minerider-lua"
path = "src/bin/minerider_lua.rs"
required-features = ["lua"]

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
rsa = { workspace = true }

# Only used by `src/bin/socks5_benchmark.rs` and `src/bin/full_runtime_benchmark.rs`
# to read this process's own working-set size for their memory benchmarks;
# Linux reads /proc/self/status instead (no dependency needed there).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

[profile.release]
lto = "thin"
codegen-units = 1
