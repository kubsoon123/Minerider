[package]
name = "minerider"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "High performance Minecraft Java Edition client engine: Rust core, Lua scripting, generated protocol"
license = "MIT OR Apache-2.0"
keywords = ["minecraft", "client", "bot", "protocol"]
categories = ["game-development", "network-programming"]

[dependencies]
tokio = { version = "1", features = ["full"] }
bytes = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
rsa = "0.9"
aes = "0.8"
cfb8 = "0.8"
flate2 = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }

[profile.release]
lto = "thin"
codegen-units = 1
