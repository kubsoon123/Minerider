[workspace]
members = [".", "crates/minerider-protocol", "crates/minerider-codegen"]

[workspace.dependencies]
bytes = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
rsa = "0.9"
aes = "0.8"
cfb8 = "0.8"
rand = "0.8"
sha1 = "0.10"
criterion = "0.5"

[package]
name = "minerider"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "High performance Minecraft Java Edition client engine: Rust core, generated protocol; Lua scripting planned"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["minecraft", "client", "bot", "protocol"]
categories = ["game-development", "network-programming"]

[dependencies]
minerider-protocol = { path = "crates/minerider-protocol", version = "0.1.0" }
tokio = { version = "1", features = ["full"] }
# Tokio project's own cancellation primitive (`CancellationToken`), used by
# `core::supervisor`: a hand-rolled watch-channel flag hit real borrow-check
# conflicts with `tokio::select!` arms that also need `&self`, plus a
# busy-loop risk once the sending handle is dropped. `sync`-only, no
# runtime/codec/net features pulled in.
tokio-util = { version = "0.7", default-features = false }
bytes = { workspace = true }
thiserror = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha1 = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
rsa = { workspace = true }

# Only used by `src/bin/socks5_benchmark.rs` and `src/bin/full_runtime_benchmark.rs`
# to read this process's own working-set size for their memory benchmarks;
# Linux reads /proc/self/status instead (no dependency needed there).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

[profile.release]
lto = "thin"
codegen-units = 1
